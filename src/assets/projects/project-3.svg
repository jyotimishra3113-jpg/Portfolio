<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="pbiGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#09090C" />
  <circle cx="400" cy="250" r="240" fill="url(#pbiGlow)" />

  <!-- Power BI KPI Grid Cards -->
  <g transform="translate(140, 110)">
    <!-- KPI Card 1 -->
    <rect x="0" y="0" width="160" height="85" rx="4" fill="#14161A" stroke="#CCFF00" stroke-width="1.5" />
    <text x="16" y="28" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">TOTAL REVENUE (DAX)</text>
    <text x="16" y="60" fill="#CCFF00" font-family="'Inter', sans-serif" font-size="20" font-weight="900">$2.48M</text>
    <text x="110" y="60" fill="#CCFF00" font-family="'Inter', sans-serif" font-size="11" font-weight="600">+18.4% ↑</text>

    <!-- KPI Card 2 -->
    <rect x="180" y="0" width="160" height="85" rx="4" fill="#14161A" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
    <text x="196" y="28" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">PROFIT MARGIN</text>
    <text x="196" y="60" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="20" font-weight="900">32.6%</text>

    <!-- KPI Card 3 -->
    <rect x="360" y="0" width="160" height="85" rx="4" fill="#14161A" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
    <text x="376" y="28" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">SALES KPI TARGET</text>
    <text x="376" y="60" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="20" font-weight="900">96.8%</text>

    <!-- Bottom Chart Area -->
    <rect x="0" y="105" width="520" height="155" rx="4" fill="#111216" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Area Chart Gradient Line -->
    <path d="M 20 220 L 70 190 L 130 205 L 200 160 L 270 175 L 340 140 L 410 150 L 500 120" fill="none" stroke="#CCFF00" stroke-width="3" />
    <circle cx="500" cy="120" r="5" fill="#CCFF00" />
    <line x1="20" y1="240" x2="500" y2="240" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  </g>

  <!-- Labels -->
  <text x="50" y="70" fill="#CCFF00" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="3">POWER BI BUSINESS SALES DASHBOARD // DAX &amp; POWER QUERY</text>
  <text x="50" y="445" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="13" letter-spacing="1">DYNAMIC KPI TRACKING • PIPELINE AUTOMATION</text>
  <circle cx="750" cy="70" r="5" fill="#CCFF00" />
</svg>
