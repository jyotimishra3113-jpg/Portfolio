<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="edaGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="appleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="100%" stop-color="#99E600" />
    </linearGradient>
    <linearGradient id="samsungBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
  </defs>

  <!-- Pure Black Background -->
  <rect width="1280" height="720" fill="#000000" />
  <circle cx="640" cy="360" r="420" fill="url(#edaGlow)" />

  <!-- ==================== TOP TITLE BAR (1280 x 46) ==================== -->
  <rect width="1280" height="46" fill="#111214" />
  <line x1="0" y1="46" x2="1280" y2="46" stroke="#262833" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="23" r="5.5" fill="#FF5F56" />
  <circle cx="44" cy="23" r="5.5" fill="#FFBD2E" />
  <circle cx="64" cy="23" r="5.5" fill="#27C93F" />

  <!-- Center Address Pill -->
  <rect x="120" y="10" width="460" height="26" rx="4" fill="#1A1D24" stroke="#2E3340" stroke-width="1" />
  <text x="350" y="27" text-anchor="middle" fill="#CCFF00" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SMARTPHONE MARKET ANALYSIS // PYTHON &amp; TABLEAU</text>
  <text x="600" y="27" fill="#6B7280" font-family="'Inter', monospace" font-size="10" font-weight="700">N = 1,380 DATASET</text>

  <!-- ==================== TOP ROW: 3 KPI METRIC CARDS (Y=64, H=98) ==================== -->
  <!-- KPI 1: Median Selling Price -->
  <g transform="translate(40, 64)">
    <rect width="380" height="98" rx="4" fill="#111214" stroke="#CCFF00" stroke-width="1.2" />
    <text x="20" y="32" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">AVG SELLING PRICE</text>
    <text x="20" y="68" fill="#CCFF00" font-family="'Inter', sans-serif" font-size="28" font-weight="900">$589</text>
    <rect x="200" y="44" width="160" height="24" rx="12" fill="#CCFF00" fill-opacity="0.12" />
    <text x="280" y="60" text-anchor="middle" fill="#CCFF00" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">+14.2% FLAGSHIP TIER</text>
    <text x="20" y="86" fill="#6B7280" font-family="'Inter', sans-serif" font-size="9.5">Market Range: $129 (Budget) – $1,399 (Ultra)</text>
  </g>

  <!-- KPI 2: Key Spec Correlation -->
  <g transform="translate(440, 64)">
    <rect width="380" height="98" rx="4" fill="#111214" stroke="#262833" stroke-width="1.2" />
    <text x="20" y="32" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">SPEC / PRICE CORRELATION</text>
    <text x="20" y="68" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="900">r = 0.79</text>
    <text x="170" y="52" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">RAM &amp; CHIPSET</text>
    <text x="170" y="68" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">Strong Linear Link (p &lt; .0001)</text>
    <rect x="20" y="80" width="340" height="4" rx="2" fill="#1F2229" />
    <rect x="20" y="80" width="268" height="4" rx="2" fill="#CCFF00" />
  </g>

  <!-- KPI 3: 5G Adoption Rate -->
  <g transform="translate(840, 64)">
    <rect width="400" height="98" rx="4" fill="#111214" stroke="#262833" stroke-width="1.2" />
    <text x="20" y="32" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">5G PENETRATION RATE</text>
    <text x="20" y="68" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="900">86.4%</text>
    <rect x="180" y="44" width="200" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08" />
    <text x="280" y="60" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">ANOVA: F = 48.72 (p &lt; .001)</text>
    <text x="20" y="86" fill="#6B7280" font-family="'Inter', sans-serif" font-size="9.5">5G price premium gap: +$184 avg across brands</text>
  </g>

  <!-- ==================== BOTTOM ROW: 2 DETAILED ANALYTICS PANELS (Y=180, H=476) ==================== -->
  <!-- LEFT PANEL: Brand Pricing Tiers -->
  <g transform="translate(40, 180)">
    <rect width="580" height="476" rx="4" fill="#111214" stroke="#262833" stroke-width="1.2" />
    <text x="24" y="34" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">BRAND PRICING TIERS</text>
    
    <!-- Legend -->
    <g transform="translate(380, 22)">
      <circle cx="6" cy="8" r="4" fill="#CCFF00" />
      <text x="16" y="12" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10.5">Flagship</text>
      <circle cx="80" cy="8" r="4" fill="#6B7280" />
      <text x="90" y="12" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10.5">Mid / Budget</text>
    </g>

    <!-- Gridlines & Axis -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" transform="translate(130, 60)">
      <line x1="0" y1="0" x2="0" y2="340" />
      <line x1="90" y1="0" x2="90" y2="340" />
      <line x1="180" y1="0" x2="180" y2="340" />
      <line x1="270" y1="0" x2="270" y2="340" />
      <line x1="360" y1="0" x2="360" y2="340" />
    </g>
    <g fill="#6B7280" font-family="'Inter', monospace" font-size="10" transform="translate(130, 422)">
      <text x="-8" y="0">$0</text>
      <text x="76" y="0">$400</text>
      <text x="166" y="0">$800</text>
      <text x="250" y="0">$1,200</text>
      <text x="340" y="0">$1,600</text>
    </g>

    <!-- Brands -->
    <!-- 1. Apple -->
    <g transform="translate(24, 85)">
      <text x="0" y="20" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">APPLE</text>
      <rect x="106" y="6" width="225" height="18" rx="4" fill="url(#appleBar)" />
      <circle cx="218" cy="15" r="5" fill="#111214" stroke="#FFFFFF" stroke-width="2" />
      <text x="344" y="20" fill="#CCFF00" font-family="'Inter', monospace" font-size="12" font-weight="800">$999</text>
    </g>

    <!-- 2. Samsung -->
    <g transform="translate(24, 145)">
      <text x="0" y="20" fill="#E5E7EB" font-family="'Inter', sans-serif" font-size="12" font-weight="600">SAMSUNG</text>
      <rect x="106" y="6" width="168" height="18" rx="4" fill="url(#samsungBar)" />
      <circle cx="190" cy="15" r="5" fill="#111214" stroke="#FFFFFF" stroke-width="2" />
      <text x="286" y="20" fill="#E5E7EB" font-family="'Inter', monospace" font-size="12" font-weight="700">$649</text>
    </g>

    <!-- 3. OnePlus -->
    <g transform="translate(24, 205)">
      <text x="0" y="20" fill="#D1D5DB" font-family="'Inter', sans-serif" font-size="12" font-weight="600">ONEPLUS</text>
      <rect x="106" y="6" width="155" height="18" rx="4" fill="#374151" />
      <rect x="106" y="6" width="105" height="18" rx="4" fill="#CCFF00" fill-opacity="0.4" />
      <circle cx="180" cy="15" r="5" fill="#111214" stroke="#FFFFFF" stroke-width="2" />
      <text x="274" y="20" fill="#D1D5DB" font-family="'Inter', monospace" font-size="12" font-weight="700">$599</text>
    </g>

    <!-- 4. Xiaomi -->
    <g transform="translate(24, 265)">
      <text x="0" y="20" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12" font-weight="500">XIAOMI</text>
      <rect x="106" y="6" width="98" height="18" rx="4" fill="#2E3340" />
      <circle cx="145" cy="15" r="5" fill="#111214" stroke="#FFFFFF" stroke-width="2" />
      <text x="216" y="20" fill="#9CA3AF" font-family="'Inter', monospace" font-size="12" font-weight="600">$329</text>
    </g>

    <!-- 5. Vivo / Oppo -->
    <g transform="translate(24, 325)">
      <text x="0" y="20" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12" font-weight="500">VIVO/OPPO</text>
      <rect x="106" y="6" width="86" height="18" rx="4" fill="#252A35" />
      <circle cx="132" cy="15" r="5" fill="#111214" stroke="#FFFFFF" stroke-width="2" />
      <text x="204" y="20" fill="#9CA3AF" font-family="'Inter', monospace" font-size="12" font-weight="600">$289</text>
    </g>

    <!-- 6. Realme -->
    <g transform="translate(24, 385)">
      <text x="0" y="20" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12" font-weight="500">REALME</text>
      <rect x="106" y="6" width="76" height="18" rx="4" fill="#1C2028" />
      <circle cx="122" cy="15" r="5" fill="#111214" stroke="#FFFFFF" stroke-width="2" />
      <text x="194" y="20" fill="#9CA3AF" font-family="'Inter', monospace" font-size="12" font-weight="600">$249</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Scatter Regression & Feature Driver Weights -->
  <g transform="translate(640, 180)">
    <rect width="600" height="476" rx="4" fill="#111214" stroke="#262833" stroke-width="1.2" />
    
    <!-- Header -->
    <text x="24" y="34" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">PRICE vs RAM SPECIFICATION</text>
    <text x="576" y="34" text-anchor="end" fill="#CCFF00" font-family="'Inter', monospace" font-size="11" font-weight="700">R² = 0.72 | +$58/GB</text>

    <!-- Scatter & Regression Chart Area -->
    <g transform="translate(24, 52)">
      <rect width="552" height="190" fill="#090A0D" stroke="#262833" stroke-width="1" rx="3" />
      
      <!-- Axes -->
      <line x1="40" y1="160" x2="520" y2="160" stroke="#374151" stroke-width="1.2" />
      <line x1="40" y1="20" x2="40" y2="160" stroke="#374151" stroke-width="1.2" />

      <!-- Regression Trend Line & Confidence Band -->
      <polygon points="50,154 500,32 500,48 50,142" fill="#CCFF00" fill-opacity="0.08" />
      <line x1="50" y1="148" x2="500" y2="40" stroke="#CCFF00" stroke-width="2.5" />

      <!-- Scatter Dots -->
      <!-- 4GB-6GB Budget Tier -->
      <circle cx="90" cy="140" r="3.5" fill="#9CA3AF" fill-opacity="0.7" />
      <circle cx="120" cy="134" r="4" fill="#9CA3AF" fill-opacity="0.8" />
      <circle cx="150" cy="130" r="3.5" fill="#9CA3AF" fill-opacity="0.6" />
      <circle cx="170" cy="122" r="4" fill="#9CA3AF" fill-opacity="0.7" />

      <!-- 8GB Mid Tier -->
      <circle cx="240" cy="106" r="4.5" fill="#FFFFFF" fill-opacity="0.85" />
      <circle cx="270" cy="98" r="5" fill="#FFFFFF" fill-opacity="0.9" />
      <circle cx="300" cy="90" r="4.5" fill="#CCFF00" />
      <circle cx="330" cy="84" r="4.5" fill="#FFFFFF" fill-opacity="0.75" />
      <circle cx="360" cy="78" r="5" fill="#FFFFFF" fill-opacity="0.8" />

      <!-- 12-16GB Flagship Tier -->
      <circle cx="420" cy="62" r="5" fill="#CCFF00" />
      <circle cx="450" cy="52" r="5.5" fill="#CCFF00" />
      <circle cx="480" cy="44" r="6" fill="#CCFF00" />
      
      <!-- Outlier Ring -->
      <circle cx="480" cy="44" r="11" fill="none" stroke="#CCFF00" stroke-width="1.2" stroke-dasharray="3 3" />
      <text x="410" y="30" fill="#CCFF00" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">16GB Flagship Tier</text>

      <text x="470" y="178" fill="#6B7280" font-family="'Inter', sans-serif" font-size="10.5">RAM (GB) →</text>
      <text x="12" y="32" fill="#6B7280" font-family="'Inter', sans-serif" font-size="10.5">Price ($)</text>
    </g>

    <!-- Hypothesis Validation Strip -->
    <g transform="translate(24, 256)">
      <rect width="552" height="38" rx="4" fill="#151820" stroke="#CCFF00" stroke-opacity="0.3" stroke-width="1" />
      <text x="18" y="24" fill="#CCFF00" font-family="'Inter', monospace" font-size="12" font-weight="800">ANOVA F = 48.72</text>
      <text x="180" y="23" fill="#E5E7EB" font-family="'Inter', sans-serif" font-size="11">Statistically significant 5G price premium gap confirmed (p = 2.4e-9)</text>
    </g>

    <!-- Feature Driver Weights -->
    <g transform="translate(24, 314)">
      <text x="0" y="16" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">FEATURE DRIVERS (SHAP IMPORTANCE)</text>
      
      <!-- Feature 1: Chipset -->
      <g transform="translate(0, 30)">
        <text x="0" y="14" fill="#E5E7EB" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">CHIPSET</text>
        <rect x="80" y="4" width="380" height="12" rx="6" fill="#1F2430" />
        <rect x="80" y="4" width="292" height="12" rx="6" fill="#CCFF00" />
        <text x="475" y="15" fill="#CCFF00" font-family="'Inter', monospace" font-size="11" font-weight="800">38.4%</text>
      </g>

      <!-- Feature 2: RAM -->
      <g transform="translate(0, 56)">
        <text x="0" y="14" fill="#E5E7EB" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">RAM</text>
        <rect x="80" y="4" width="380" height="12" rx="6" fill="#1F2430" />
        <rect x="80" y="4" width="221" height="12" rx="6" fill="#FFFFFF" />
        <text x="475" y="15" fill="#FFFFFF" font-family="'Inter', monospace" font-size="11" font-weight="800">29.1%</text>
      </g>

      <!-- Feature 3: Camera -->
      <g transform="translate(0, 82)">
        <text x="0" y="14" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">CAMERA</text>
        <rect x="80" y="4" width="380" height="12" rx="6" fill="#1F2430" />
        <rect x="80" y="4" width="141" height="12" rx="6" fill="#9CA3AF" />
        <text x="475" y="15" fill="#9CA3AF" font-family="'Inter', monospace" font-size="11" font-weight="800">18.6%</text>
      </g>

      <!-- Feature 4: Battery -->
      <g transform="translate(0, 108)">
        <text x="0" y="14" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">BATTERY</text>
        <rect x="80" y="4" width="380" height="12" rx="6" fill="#1F2430" />
        <rect x="80" y="4" width="105" height="12" rx="6" fill="#4B5563" />
        <text x="475" y="15" fill="#6B7280" font-family="'Inter', monospace" font-size="11" font-weight="800">13.9%</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTER BAR (1280 x 48) ==================== -->
  <rect y="672" width="1280" height="48" fill="#0C0E12" />
  <line x1="0" y1="672" x2="1280" y2="672" stroke="#262833" stroke-width="1" />
  <text x="40" y="702" fill="#CCFF00" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="1">SMARTPHONE MARKET EDA</text>
  <text x="240" y="702" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" letter-spacing="0.5">•  STATISTICAL HYPOTHESIS TESTING  •  SPECIFICATION CORRELATION  •  PRICE PREDICTION MODELING</text>
</svg>
