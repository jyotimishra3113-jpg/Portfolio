<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="recGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#09090C" />
  <circle cx="400" cy="250" r="240" fill="url(#recGlow)" />
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Platform Card UI Mockup -->
  <rect x="180" y="100" width="440" height="280" rx="6" fill="#111216" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
  
  <!-- Security Shield & Guest Access Indicator -->
  <g transform="translate(400, 200)">
    <!-- Shield -->
    <path d="M0 -55 L45 -35 L45 15 C45 45 0 65 0 65 C0 65 -45 45 -45 15 L-45 -35 Z" fill="#181B20" stroke="#CCFF00" stroke-width="2" />
    <!-- Keyhole / Check -->
    <path d="M-12 5 L-3 15 L15 -5" fill="none" stroke="#CCFF00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Module Cards in UI -->
  <rect x="210" y="295" width="180" height="60" rx="4" fill="#16181D" stroke="#CCFF00" stroke-opacity="0.4" stroke-width="1" />
  <text x="225" y="322" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SECURITY MODULE</text>
  <text x="225" y="342" fill="#CCFF00" font-family="'Inter', sans-serif" font-size="10" font-mono="true">AUTH &amp; ENCRYPTION</text>

  <rect x="410" y="295" width="180" height="60" rx="4" fill="#16181D" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="425" y="322" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">GUEST MODULE</text>
  <text x="425" y="342" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10" font-mono="true">JOB SEEKER PORTAL</text>

  <!-- Header Details -->
  <text x="50" y="70" fill="#CCFF00" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="3">GLOBALAKJOBS // RECRUITMENT PLATFORM</text>
  <text x="50" y="445" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="13" letter-spacing="1">YASWANTH RURAL DEVELOPMENT SOCIETY • BENGALURU</text>
  <circle cx="750" cy="70" r="5" fill="#CCFF00" />
</svg>
